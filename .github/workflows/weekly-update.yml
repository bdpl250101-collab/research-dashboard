# 매주 논문·뉴스를 수집해 대시보드를 다시 만들고 커밋한다.
# GitHub Pages 는 main 브랜치의 /docs 폴더를 소스로 쓰도록 설정해 두면
# 커밋이 올라갈 때마다 자동으로 다시 배포된다 (별도 배포 액션 불필요).
#   저장소 Settings > Pages > Source: "Deploy from a branch" > main / docs
name: weekly-update

on:
  workflow_dispatch:      # 수동 실행 (Actions 탭에서 Run workflow)
    inputs:
      days:
        description: "조회 기간(일)"
        required: false
        default: "7"
  schedule:
    # 매주 월요일 00:00 UTC = 한국시간 09:00
    - cron: "0 0 * * 1"

# 기본 GITHUB_TOKEN 으로 수집 결과를 커밋한다
permissions:
  contents: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 오프라인 테스트
        run: |
          python tests/test_papers.py
          python tests/test_news.py
          python tests/test_jobs.py
          python tests/test_render.py

      - name: 수집 + 대시보드 생성
        env:
          # Crossref polite pool. 저장소 Settings > Secrets 에 등록하면 쓰인다.
          # 없어도 동작하며, 그 경우 응답이 조금 불안정해질 수 있다.
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
          # 사람인 오픈 API 키. 없으면 채용 수집만 건너뛰고 논문·뉴스는 정상 동작한다.
          SARAMIN_API_KEY: ${{ secrets.SARAMIN_API_KEY }}
        run: python -m src.pipeline --days ${{ github.event.inputs.days || 7 }}

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 건너뜀"
          else
            git commit -m "주간 갱신: $(date -u +%Y-%m-%d)"
            git push
          fi
